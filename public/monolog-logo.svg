<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="herdr-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2ded4" stroke-width="1.2" stroke-opacity="0.75" />
    </pattern>
    <!-- Subtle drop shadow -->
    <filter id="card-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#15140f" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#15140f" flood-opacity="0.08" />
    </filter>
    <!-- Spot shadow -->
    <filter id="spot-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8839ef" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="#efece5" stroke="#cbc5b6" stroke-width="4" />
  
  <!-- Subtle Technical Grid Fill -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#herdr-grid)" />

  <!-- Inner Elevated Paper Card -->
  <rect x="80" y="80" width="352" height="352" rx="40" ry="40" fill="#f7f5ef" stroke="#ddd8cc" stroke-width="2.5" filter="url(#card-shadow)" />

  <!-- Monogram M: Left Column / Page Fold -->
  <path d="M 148 152 
           L 196 152 
           L 196 360 
           L 148 360 
           Z" 
        fill="#15140f" />

  <!-- Monogram M: Diagonal Left Peak -->
  <path d="M 196 152 
           L 256 264 
           L 256 360 
           L 196 248 
           Z" 
        fill="#262520" />

  <!-- Monogram M: Diagonal Right Peak -->
  <path d="M 256 264 
           L 316 152 
           L 316 248 
           L 256 360 
           Z" 
        fill="#15140f" />

  <!-- Monogram M: Right Column Base -->
  <path d="M 316 200 
           L 364 200 
           L 364 360 
           L 316 360 
           Z" 
        fill="#15140f" />

  <!-- Notion/Herdr Style Folded Corner in Spot Accent (#8839ef) -->
  <path d="M 316 152 
           L 364 200 
           L 316 200 
           Z" 
        fill="#8839ef" 
        filter="url(#spot-shadow)" />

  <!-- Fold Crease Line Accent -->
  <path d="M 316 152 L 364 200" stroke="#b27cf5" stroke-width="3.5" stroke-linecap="round" />

  <!-- Modern Tech Notch / Pen Dot -->
  <circle cx="256" cy="180" r="11" fill="#8839ef" />
</svg>
