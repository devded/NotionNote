name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and release (e.g. v0.1.0)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  # Never cancel an in-progress release build.
  cancel-in-progress: false

permissions:
  contents: write # required to create releases and upload release assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (AppImage + deb)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            files: appimage/*.AppImage deb/*.deb
            slug: linux-x86_64
          - name: macOS ARM64 (dmg)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            files: dmg/*.dmg
            slug: macos-arm64
          # Cross-compiled: the Rust target, not the runner, decides the arch.
          - name: macOS Intel (dmg)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            files: dmg/*.dmg
            slug: macos-x86_64
          - name: Windows x86_64 (msi + exe)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            files: msi/*.msi nsis/*.exe
            slug: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned / unnotarized on purpose. To sign later, set the APPLE_*
      # secrets (macOS) or a certificate secret (Windows); Tauri's bundler
      # picks them up from the env.
      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # An unmatched glob stays literal, so cp fails the step if a bundle is missing.
      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          for f in ${{ matrix.files }}; do
            cp "$f" "$GITHUB_WORKSPACE/dist-release/Monolog-${{ matrix.slug }}.${f##*.}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: dist-release/*
          if-no-files-found: error

  # ----------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the release and upload assets

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Release Tag & Version
        id: meta
        run: |
          RAW_TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          if [[ "$RAW_TAG" != v* ]]; then
            TAG="v$RAW_TAG"
          else
            TAG="$RAW_TAG"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches tauri.conf.json version
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TARGET_VERSION="${{ steps.meta.outputs.version }}"
          if [ "$CONF_VERSION" != "$TARGET_VERSION" ]; then
            echo "::error::Tag v$TARGET_VERSION does not match tauri.conf.json version $CONF_VERSION."
            echo "Update src-tauri/tauri.conf.json (and Cargo.toml) before releasing."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Validate complete artifact set
        run: |
          cd dist-release
          for f in \
            Monolog-linux-x86_64.AppImage \
            Monolog-linux-x86_64.deb \
            Monolog-macos-arm64.dmg \
            Monolog-macos-x86_64.dmg \
            Monolog-windows-x86_64.msi \
            Monolog-windows-x86_64.exe; do
            test -s "$f" || { echo "::error::Missing or empty artifact: $f"; exit 1; }
          done
          ls -la

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading build assets..."
            gh release upload "$TAG" dist-release/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --title "Monolog $TAG" \
              --generate-notes \
              dist-release/*
          fi
