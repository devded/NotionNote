name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  # Never cancel an in-progress release build.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ Linux
  build-linux:
    name: Linux x86_64 (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu --bundles appimage,deb

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage dist-release/NotionNote-linux-x86_64.AppImage
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb dist-release/NotionNote-linux-x86_64.deb

      - name: Validate artifacts
        run: |
          test -f dist-release/NotionNote-linux-x86_64.AppImage || { echo "::error::AppImage missing"; exit 1; }
          test -f dist-release/NotionNote-linux-x86_64.deb || { echo "::error::deb missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist-release/*
          if-no-files-found: error

  # ------------------------------------------------------------ macOS ARM64
  build-macos-arm64:
    name: macOS ARM64 (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned / unnotarized on purpose. To add signing later, set the
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
      # (and for notarization APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID)
      # secrets — Tauri's bundler picks them up automatically from the env.
      - name: Build Tauri app
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-release/NotionNote-macos-arm64.dmg

      - name: Validate artifacts
        run: |
          test -f dist-release/NotionNote-macos-arm64.dmg || { echo "::error::dmg missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist-release/*
          if-no-files-found: error

  # ------------------------------------------------------------- macOS Intel
  build-macos-intel:
    name: macOS Intel (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Cross-compiles the x86_64 target; the runner architecture does not
      # decide the bundle architecture — the Rust target above does.
      - name: Build Tauri app
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg dist-release/NotionNote-macos-x86_64.dmg

      - name: Validate artifacts
        run: |
          test -f dist-release/NotionNote-macos-x86_64.dmg || { echo "::error::dmg missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist-release/*
          if-no-files-found: error

  # ----------------------------------------------------------------- Windows
  build-windows:
    name: Windows x86_64 (msi + exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned on purpose. To add signing later, configure a certificate
      # secret and pass it to Tauri's Windows signing settings.
      - name: Build Tauri app
        shell: bash
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles msi,nsis

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi dist-release/NotionNote-windows-x86_64.msi
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist-release/NotionNote-windows-x86_64.exe

      - name: Validate artifacts
        shell: bash
        run: |
          test -f dist-release/NotionNote-windows-x86_64.msi || { echo "::error::msi missing"; exit 1; }
          test -f dist-release/NotionNote-windows-x86_64.exe || { echo "::error::exe missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist-release/*
          if-no-files-found: error

  # ----------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos-arm64
      - build-macos-intel
      - build-windows
    permissions:
      contents: write # create the release and upload assets

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches tauri.conf.json version
        run: |
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match tauri.conf.json version $CONF_VERSION."
            echo "Update src-tauri/tauri.conf.json (and Cargo.toml) before tagging."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Validate complete artifact set
        run: |
          cd dist-release
          for f in \
            NotionNote-linux-x86_64.AppImage \
            NotionNote-linux-x86_64.deb \
            NotionNote-macos-arm64.dmg \
            NotionNote-macos-x86_64.dmg \
            NotionNote-windows-x86_64.msi \
            NotionNote-windows-x86_64.exe; do
            test -s "$f" || { echo "::error::Missing or empty artifact: $f"; exit 1; }
          done
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "NotionNote $GITHUB_REF_NAME" \
            --generate-notes \
            dist-release/*
